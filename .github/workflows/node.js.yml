---
name: CI Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  - test-node:
    runs-on: ubuntu-latest
    uses: actions/checkout@v7
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        # Supported Node.js releases https://nodejs.org/en/about/releases/
    steps:
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests on node
        run: node --test

  - test-bun:
    runs-on: ubuntu-latest
    uses: actions/checkout@v7
    steps:
      - name: Intall latest bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run tests on bun
        run: bun test

  - test-deno:
    runs-on: ubuntu-latest
    uses: actions/checkout@v7
    steps:
      - name: Intall latest deno
        uses: denoland/setup-deno@v2v2.x
        with:
          deno-version: latest

      - name: Run tests on deno
        run: deno test
