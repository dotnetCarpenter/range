---
name: CI Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-node:
    name: Node.js Run JavaScript Everywhere
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        # Supported Node.js releases https://nodejs.org/en/about/releases/
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests on node
        run: node --test

  test-bun:
    name: Bun is a fast JavaScript runtime & toolkit. All in one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Intall latest bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run tests on bun
        run: bun test

  test-deno:
    name: Deno - Faster than Node; more stable than Bun.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Intall latest deno
        uses: denoland/setup-deno@v2v2.x
        with:
          deno-version: latest

      - name: Run tests on deno
        run: deno test
